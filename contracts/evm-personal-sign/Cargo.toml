[package]
name = "evm-personal-sign"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Omnilock exec verifier for EVM wallet recovery backups: personal_sign of KeyWay's readable approval"

[[bin]]
name = "evm-personal-sign"
path = "src/main.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"

[dependencies]
keyway-approval = { path = "../keyway-approval" }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10.8", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
ckb-std = { version = "1.1.0", default-features = false, features = ["dummy-atomic"] }
