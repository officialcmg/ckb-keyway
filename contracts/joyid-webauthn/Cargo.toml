[package]
name = "joyid-webauthn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Omnilock exec verifier for JoyID (WebAuthn, P-256) recovery backups"

[[bin]]
name = "joyid-webauthn"
path = "src/main.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"

[dependencies]
blake2b-ref = "0.3.1"
ecdsa = { version = "0.16.9", default-features = false, features = ["verifying"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10.8", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
ckb-std = { version = "1.1.0", default-features = false, features = ["dummy-atomic"] }
